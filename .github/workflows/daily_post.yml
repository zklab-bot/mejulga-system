name: Daily Carrossel — Dra. Julga

on:
  schedule:
    - cron: "0 15 * * *"   # 12h BRT
    - cron: "0 21 * * *"   # 18h BRT
    - cron: "0 0 * * *"    # 21h BRT
  workflow_dispatch:        # permite rodar manualmente

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # necessário para commitar category_state.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Python deps
        run: |
          cd content-engine
          pip install -r requirements.txt

      - name: Install Node deps + Playwright
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          cd content-engine
          python run_pipeline.py

      - name: Commit category state
        run: |
          git config user.name "zklab-bot"
          git config user.email "bot@zklab.com.br"
          git add category_state.json
          git diff --staged --quiet || git commit -m "chore: update category rotation state [skip ci]"
          git push
